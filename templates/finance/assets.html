{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Assets</h3>
  <a href="{{ url_for('finance_add_asset') }}" class="btn btn-secondary btn-sm">Add Asset</a>
</div>
<table class="table table-sm">
  <thead><tr><th>Name</th><th>Category</th><th class="text-end">Value</th></tr></thead>
  <tbody>
    {% for a in assets %}
    <tr>
      <td>{{ a.name }}</td>
      <td>{{ a.category }}</td>
      <td class="text-end">${{ '%.2f'|format(a.value) }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
