{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Invoices & Quotations</h3>
  <a href="{{ url_for('finance_create_invoice') }}" class="btn btn-primary btn-sm">Create</a>
</div>
<table class="table table-sm">
  <thead><tr><th>#</th><th>Client</th><th>Type</th><th>Date</th><th class="text-end">Total</th></tr></thead>
  <tbody>
    {% for inv in invoices %}
    <tr>
      <td>{{ inv.number }}</td>
      <td>{{ inv.client }}</td>
      <td><span class="badge {{ 'bg-info' if inv.kind=='Quotation' else 'bg-primary' }}">{{ inv.kind }}</span></td>
      <td>{{ inv.date.strftime('%Y-%m-%d') }}</td>
      <td class="text-end">${{ '%.2f'|format(inv.total) }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
