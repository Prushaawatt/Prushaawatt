{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Create Invoice/Quotation</h3>
<form method="post">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Type</label>
      <select class="form-select" name="kind">
        <option>Invoice</option>
        <option>Quotation</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Number</label>
      <input class="form-control" name="number" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Date</label>
      <input class="form-control" type="date" name="date" value="{{ today }}" required>
    </div>
  </div>
  <div class="row g-3 mt-1">
    <div class="col-md-6">
      <label class="form-label">Client</label>
      <input class="form-control" name="client" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Total</label>
      <input class="form-control" type="number" step="0.01" name="total" required>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('finance_invoices') }}">Cancel</a>
  </div>
</form>
{% endblock %}
