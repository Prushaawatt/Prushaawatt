{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Stock Movements</h3>
<form class="row g-3 mb-3" method="post">
  <div class="col-md-4">
    <label class="form-label">Product</label>
    <select class="form-select" name="product_id">
      {% for p in products %}
      <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Type</label>
    <select class="form-select" name="kind">
      <option>IN</option>
      <option>OUT</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Quantity</label>
    <input class="form-control" type="number" name="quantity" value="1" required>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Record</button>
    <a class="btn btn-secondary" href="{{ url_for('inventory_index') }}">Back</a>
  </div>
</form>
<table class="table table-sm">
  <thead><tr><th>Date</th><th>Product</th><th>Type</th><th class="text-end">Qty</th></tr></thead>
  <tbody>
    {% for m in movements %}
    <tr>
      <td>{{ m.date.strftime('%Y-%m-%d %H:%M') }}</td>
      <td>{{ m.product.name }}</td>
      <td>{{ m.kind }}</td>
      <td class="text-end">{{ m.quantity }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
