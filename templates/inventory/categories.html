{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Categories</h3>
<form class="row g-3 mb-3" method="post">
  <div class="col-auto">
    <input class="form-control" name="name" placeholder="New Category">
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" type="submit">Add</button>
  </div>
</form>
<ul class="list-group">
  {% for c in categories %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    {{ c.name }}
    <span class="badge bg-secondary">{{ c.products|length }} products</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
