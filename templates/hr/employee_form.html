{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Add Employee</h3>
<form method="post" enctype="multipart/form-data">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Name</label>
      <input class="form-control" name="name" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Role</label>
      <input class="form-control" name="role" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Salary</label>
      <input class="form-control" type="number" step="0.01" name="salary" required>
    </div>
  </div>
  <div class="row g-3 mt-1">
    <div class="col-md-6">
      <label class="form-label">Department</label>
      <input class="form-control" name="department">
    </div>
    <div class="col-md-6">
      <label class="form-label">Contract/Document (PDF)</label>
      <input class="form-control" type="file" name="document">
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('hr_index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
