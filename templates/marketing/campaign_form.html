{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Add Campaign</h3>
<form method="post">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Name</label>
      <input class="form-control" name="name" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Channel</label>
      <input class="form-control" name="channel" placeholder="Email, Social, Ads" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Status</label>
      <select class="form-select" name="status">
        <option>Planned</option>
        <option>Running</option>
        <option>Completed</option>
      </select>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('marketing_index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
